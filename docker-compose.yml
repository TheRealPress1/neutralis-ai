services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file: .env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  daemon:
    build:
      context: .
      target: daemon
    ports:
      - "9091:9091"
    env_file: .env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:9091/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
