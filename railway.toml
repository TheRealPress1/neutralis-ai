# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code
#
# This project runs TWO services on Railway (both built from this repo):
#
#   1. neutralis-daemon  → Dockerfile target: daemon  (event_daemon.py)
#   2. neutralis-api     → Dockerfile target: api     (run_api.py)
#
# In the Railway dashboard, set the env var RAILWAY_DOCKERFILE_TARGET
# to "daemon" or "api" per service. See RAILWAY.md for full setup guide.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway uses this to confirm the service is alive before routing traffic.
# The daemon exposes /health on port 9091; the API exposes /api/health on port 8000.
# Override per-service in the Railway dashboard if needed.
healthcheckPath = "/health"
healthcheckTimeout = 60

# Auto-restart on crash (handles transient Kalshi/Polymarket API errors)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
