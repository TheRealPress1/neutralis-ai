# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code
#
# This project runs up to 3 services on Railway (all from this repo):
#
#   1. neutralis-frontend → Dockerfile target: frontend  (Next.js, port 3000)
#   2. neutralis-api      → Dockerfile target: api       (FastAPI, port 8000)
#   3. neutralis-daemon   → Dockerfile target: daemon    (event engine, port 9091)
#
# In the Railway dashboard, set the Docker build target per service:
#   Settings → Build → Docker Build Target → "frontend" / "api" / "daemon"
#
# Or set the env var RAILWAY_DOCKERFILE_TARGET per service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Health check paths differ per service — set them in the Railway dashboard:
#   frontend: (none)    api: /api/health    daemon: /health
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
